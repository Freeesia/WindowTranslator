title: "WindowTranslator"
description: >-
  Windowsのアプリケーションのウィンドウを翻訳するためのツール

# Build settings
theme: jekyll-theme-cayman
plugins:
  - jekyll-feed
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM

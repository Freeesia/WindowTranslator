# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow will build, test, sign and package a WPF or Windows Forms desktop application
# built on .NET Core.
# To learn how to migrate your existing application to .NET Core,
# refer to https://docs.microsoft.com/en-us/dotnet/desktop-wpf/migration/convert-project-from-net-framework
#
# To configure this workflow:
#
# 1. Configure environment variables
# GitHub sets default environment variables for every workflow run.
# Replace the variables relative to your project in the "env" section below.
#
# 2. Signing
# Generate a signing certificate in the Windows Application
# Packaging Project or add an existing signing certificate to the project.
# Next, use PowerShell to encode the .pfx file using Base64 encoding
# by running the following Powershell script to generate the output string:
#
# $pfx_cert = Get-Content '.\SigningCertificate.pfx' -Encoding Byte
# [System.Convert]::ToBase64String($pfx_cert) | Out-File 'SigningCertificate_Encoded.txt'
#
# Open the output file, SigningCertificate_Encoded.txt, and copy the
# string inside. Then, add the string to the repo as a GitHub secret
# and name it "Base64_Encoded_Pfx."
# For more information on how to configure your signing certificate for
# this workflow, refer to https://github.com/microsoft/github-actions-for-desktop-apps#signing
#
# Finally, add the signing certificate password to the repo as a secret and name it "Pfx_Key".
# See "Build the Windows Application Packaging project" below to see how the secret is used.
#
# For more information on GitHub Actions, refer to https://github.com/features/actions
# For a complete CI/CD sample to get started with GitHub Action workflows for Desktop Applications,
# refer to https://github.com/microsoft/github-actions-for-desktop-apps

name: .NET Core Desktop

on:
  push:
    branches: [master]
    tags: [v*.*.*]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      upload_store:
        description: Upload MSIX to the Microsoft Store package flight
        type: boolean
        required: false
        default: false

jobs:
  docs:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: baileyjm02/markdown-to-pdf@v2
        with:
          input_path: docs
          output_dir: pdfs
          images_dir: docs/images
          image_import: images
          theme: docs/theme.css
          template: docs/template.html
          extend_default_theme: true
          build_html: false
      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: pdfs/
  license:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: licenses
          key: ${{ runner.os }}-licenses-${{ hashFiles('**/*.csproj') }} #hash of project files
          restore-keys: |
            ${{ runner.os }}-licenses-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: |
          dotnet tool restore
          dotnet restore
          dotnet nuget-license -t `
            -ignore ignore-packages.json `
            -override package-information.json `
            -exclude-projects exclude-projects.json `
            -ji include-projects.json `
            -d licenses `
            -fo licenses\third-party-licenses.txt `
            -f net10.0 `
            -err
      - uses: actions/upload-artifact@v7
        with:
          name: licenses
          path: licenses/
  build:
    needs:
      - docs
      - license
    if: always()
    strategy:
      matrix:
        self: [true, false]
    # For a list of available runner types, refer to
    # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on
    runs-on: windows-latest
    outputs:
      version: ${{ steps.gitversion.outputs.assemblySemFileVer }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }} #hash of project files
          restore-keys: |
            ${{ runner.os }}-nuget-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: gittools/actions/gitversion/setup@v4.7.0
        with:
          versionSpec: "6.x"
      - id: gitversion
        uses: gittools/actions/gitversion/execute@v4.7.0
      - run: |
          dotnet publish WindowTranslator -c Release -o publish --sc ${{ matrix.self }} `
            -p:Version=${{ steps.gitversion.outputs.fullSemVer }} `
            -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} `
            -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} `
            -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - run: |
          dotnet msbuild Plugins\WindowTranslator.Plugins.proj -target:PublishAppBundle `
            -p:Configuration=Release `
            -p:AppBundleOutputPath="$PWD\publish\plugins" `
            -p:Version=${{ steps.gitversion.outputs.fullSemVer }} `
            -p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} `
            -p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }} `
            -p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }} `
            -p:DecryptKey="${{ secrets.WINDOWTRANSLATOR_DECRYPTKEY }}"
      - uses: actions/download-artifact@v8
        if: ${{ needs.docs.result == 'success' }}
        with:
          name: docs
          path: publish/docs
      - uses: actions/download-artifact@v8
        if: ${{ needs.license.result == 'success' }}
        with:
          name: licenses
          path: publish/licenses
      - uses: actions/upload-artifact@v7
        with:
          name: WindowTranslator${{ matrix.self && '-full' || '' }}-${{ steps.gitversion.outputs.fullSemVer }}
          path: publish\
      - uses: getsentry/action-release@v3
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        with:
          environment: production
  installer:
    # 手動実行では docs がスキップされるため、依存ジョブの成功を明示的に確認する
    if: >-
      ${{
      !cancelled() &&
      needs.build.result == 'success' &&
      needs.license.result == 'success' &&
      (!startsWith(github.ref, 'refs/tags/') || needs.docs.result == 'success') &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_store))
      }}
    needs: [docs, license, build]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }} #hash of project files
          restore-keys: |
            ${{ runner.os }}-nuget-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: WindowTranslator-full-*
          merge-multiple: true
      - run: |
          dotnet tool restore
          dotnet wix extension -g add WixToolset.Util.wixext/5.0.2 WixToolset.UI.wixext/5.0.2
          dotnet run -c Release
        working-directory: WindowTranslator.Wix
      - name: Generate MSIX for Microsoft Store
        shell: pwsh
        env:
          MSIX_VERSION: ${{ needs.build.outputs.version }}
          PACKAGE_IDENTITY_NAME: ${{ vars.MSSTORE_PACKAGE_IDENTITY_NAME }}
          PACKAGE_PUBLISHER: ${{ vars.MSSTORE_PACKAGE_PUBLISHER }}
        run: |
          if ($env:MSIX_VERSION -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw 'MSIX version must have four numeric components.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PACKAGE_IDENTITY_NAME) -or
              [string]::IsNullOrWhiteSpace($env:PACKAGE_PUBLISHER)) {
            throw 'MSSTORE_PACKAGE_IDENTITY_NAME and MSSTORE_PACKAGE_PUBLISHER must be configured.'
          }

          $makeappx = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter makeappx.exe -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]x64[\\/]' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $makeappx) {
            throw 'makeappx.exe was not found in the Windows SDK.'
          }

          New-Item -ItemType Directory -Force -Path 'msix-staging\Images', 'publish' | Out-Null
          Copy-Item 'artifacts\*' 'msix-staging\' -Recurse -Force
          Copy-Item 'WindowTranslator.Package\Images\*' 'msix-staging\Images\' -Force

          [xml]$manifest = Get-Content 'WindowTranslator.Package\AppxManifest.xml' -Raw -Encoding UTF8
          $namespaces = [System.Xml.XmlNamespaceManager]::new($manifest.NameTable)
          $namespaces.AddNamespace('appx', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity = $manifest.SelectSingleNode('/appx:Package/appx:Identity', $namespaces)
          $identity.SetAttribute('Name', $env:PACKAGE_IDENTITY_NAME)
          $identity.SetAttribute('Publisher', $env:PACKAGE_PUBLISHER)
          $identity.SetAttribute('Version', $env:MSIX_VERSION)
          $manifest.Save((Join-Path $PWD 'msix-staging\AppxManifest.xml'))

          $msixPath = "publish\WindowTranslator-$env:MSIX_VERSION.msix"
          & $makeappx pack /d 'msix-staging' /p $msixPath /nv
          if ($LASTEXITCODE -ne 0) {
            throw "makeappx failed with exit code $LASTEXITCODE"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: WindowTranslator-${{ needs.build.outputs.version }}.msi
          path: publish\*.msi
      - uses: actions/upload-artifact@v7
        with:
          name: store-msix
          path: publish\*.msix
          if-no-files-found: error
  store-upload:
    name: Upload MSIX to Microsoft Store package flight
    if: >-
      ${{
      !cancelled() &&
      needs.installer.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.upload_store))
      }}
    needs: installer
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: store-msix
          path: store-msix
      - uses: microsoft/microsoft-store-apppublisher@v1.4
      - name: Configure Partner Center authentication
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
        run: |
          foreach ($name in @('AZURE_AD_TENANT_ID', 'AZURE_AD_APPLICATION_CLIENT_ID', 'AZURE_AD_APPLICATION_SECRET', 'SELLER_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name must be configured as a repository secret."
            }
          }
          msstore reconfigure `
            --tenantId $env:AZURE_AD_TENANT_ID `
            --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID `
            --clientSecret $env:AZURE_AD_APPLICATION_SECRET `
            --sellerId $env:SELLER_ID
          if ($LASTEXITCODE -ne 0) {
            throw "msstore reconfigure failed with exit code $LASTEXITCODE"
          }
      - name: Publish package flight submission
        shell: pwsh
        env:
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
          MSSTORE_FLIGHT_ID: ${{ vars.MSSTORE_FLIGHT_ID }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MSSTORE_PRODUCT_ID) -or
              [string]::IsNullOrWhiteSpace($env:MSSTORE_FLIGHT_ID)) {
            throw 'MSSTORE_PRODUCT_ID and MSSTORE_FLIGHT_ID must be configured as repository variables.'
          }
          $msixPath = Get-ChildItem 'store-msix' -Filter '*.msix' -File |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $msixPath) {
            throw 'The installer job did not produce a Store MSIX.'
          }
          msstore publish $msixPath -id $env:MSSTORE_PRODUCT_ID -f $env:MSSTORE_FLIGHT_ID
          if ($LASTEXITCODE -ne 0) {
            throw "msstore publish failed with exit code $LASTEXITCODE"
          }
  release:
    if: ${{ success() && startsWith(github.ref, 'refs/tags/') }}
    needs:
      - installer
      - build
      - license
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: WindowTranslator-*
      - run: |
          for dir in WindowTranslator-*/; do
            base=$(basename "$dir")
            if ! find "$dir" -maxdepth 1 -type f -name "*.msi" | read; then
                # .msiファイルが存在しない場合、既存の処理を実行
                (cd "$dir" && zip -r "../${base}.zip" .)
            fi
            # .msiファイルが存在する場合は何もしない
          done
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: true
          prerelease: false
          files: |
            WindowTranslator-*.zip
            WindowTranslator-*.msi/WindowTranslator-*.msi
